<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;align-items:flex-end;gap:12px;font-family:'Hanken Grotesk',sans-serif;font-size:12px">
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
    <sc-for list="{{ levels }}" as="l" hint-placeholder-count="4">
      <span style="display:flex;align-items:center;gap:6px;color:{{ l.color }};font-weight:{{ l.weight }}">{{ l.text }}<span style="width:5px;height:5px;border-radius:50%;background:{{ l.dot }}"></span></span>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;border-radius:10px;border:1px solid {{ t.l2 }};background:{{ t.float }};overflow:hidden;color:{{ t.t2 }}">
    <span style="width:34px;height:34px;display:grid;place-items:center;font-size:16px">+</span>
    <span style="width:34px;height:34px;display:grid;place-items:center;font-size:16px;border-top:1px solid {{ t.l2 }}">−</span>
    <span style="width:34px;height:34px;display:grid;place-items:center;border-top:1px solid {{ t.l2 }}"><span style="width:12px;height:12px;border:1.5px solid {{ t.t2 }};border-radius:3px;box-sizing:border-box"></span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:110},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
const T={dark:{float:'#141518',l2:'#24262b',t1:'#ececef',t2:'#c4c6cc',t4:'#62646b'},light:{float:'#ffffff',l2:'#e0e0db',t1:'#0f1012',t2:'#3a3c41',t4:'#8e9096'}};
class Component extends DCLogic {
  renderVals() {
    const t = T[this.props.theme === 'light' ? 'light' : 'dark'], lv = this.props.level ?? 1;
    const levels = ['System', 'Area', 'File', 'Function'].map((x, i) => ({ text: x, color: i === lv ? t.t1 : t.t4, weight: i === lv ? 600 : 400, dot: i === lv ? t.t1 : 'transparent' }));
    return { t, levels };
  }
}
</script>
</body>
</html>
