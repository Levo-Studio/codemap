<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>@keyframes ndD{0%,100%{box-shadow:0 0 0 0 rgba(240,165,90,0)}50%{box-shadow:0 0 0 6px rgba(240,165,90,.12)}}@keyframes ndL{0%,100%{box-shadow:0 0 0 0 rgba(194,101,26,0)}50%{box-shadow:0 0 0 6px rgba(194,101,26,.14)}}</style></helmet>
<div style="{{ s.box }}">
  <sc-if value="{{ isFn }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0"><span style="{{ s.name }}">{{ label }}</span><span style="{{ s.meta }}">{{ meta }}</span></div>
    <span style="{{ s.desc }}">{{ desc }}</span>
    <sc-if value="{{ status }}" hint-placeholder-val="{{ false }}"><span style="{{ s.line }}">{{ status }}</span></sc-if>
  </sc-if>
  <sc-if value="{{ notFn }}" hint-placeholder-val="{{ true }}">
    <span style="{{ s.name }}">{{ label }}</span>
    <sc-if value="{{ line2 }}" hint-placeholder-val="{{ false }}"><span style="{{ s.line }}">{{ line2 }}</span></sc-if>
  </sc-if>
  <sc-if value="{{ badge }}" hint-placeholder-val="{{ false }}"><span style="{{ s.badge }}">{{ badge }}</span></sc-if>
  <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}"><span style="{{ s.eb }}">▲</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:72},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Webhooks&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4 files&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;hover&quot;,&quot;selected&quot;,&quot;editing&quot;,&quot;reading&quot;,&quot;changed&quot;,&quot;faded&quot;,&quot;new&quot;,&quot;error&quot;,&quot;search&quot;,&quot;dimmed&quot;,&quot;unexplored&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;area&quot;,&quot;module&quot;,&quot;file&quot;,&quot;function&quot;,&quot;external&quot;],&quot;default&quot;:&quot;module&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;statusText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;err&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const T={dark:{bg:'#0b0c0e',panel:'#0f1012',cont:'#121316',card:'#17181c',hover:'#1c1d21',l1:'#1c1d21',l2:'#24262b',l3:'#2a2c31',t1:'#ececef',t2:'#c4c6cc',t3:'#9a9ca3',t4:'#62646b',edit:'#f0a55a',editBg:'#1f1a14',read:'#7fb2f0',readBg:'#131920',neu:'#6fcf97',neuBg:'#131a16',err:'#e5484d',errT:'#f2787c',inv:'#0b0c0e'},light:{bg:'#f7f7f5',panel:'#ffffff',cont:'#ffffff',card:'#fafaf8',hover:'#efefeb',l1:'#ebebe7',l2:'#e0e0db',l3:'#d3d3cd',t1:'#0f1012',t2:'#3a3c41',t3:'#62646b',t4:'#8e9096',edit:'#c2651a',editBg:'#fbf1e7',read:'#2f6fd0',readBg:'#eef3fb',neu:'#1f8a57',neuBg:'#ecf6f0',err:'#d23b40',errT:'#c0343a',inv:'#ffffff'}};
class Component extends DCLogic {
  renderVals() {
    const p = this.props, th = p.theme === 'light' ? 'light' : 'dark', t = T[th], lv = p.level || 'module', st = p.state || 'default';
    const fn = lv === 'function', file = lv === 'file', area = lv === 'area', ext = lv === 'external';
    let bg = area ? t.cont : t.card, bd = `1px solid ${area ? t.l3 : t.l2}`, nameC = t.t1, status = null, statusC = t.t4, extra = {};
    if (ext) { bg = 'transparent'; nameC = t.t2; }
    if (st === 'hover') { bg = t.hover; bd = `1px solid ${t.l3}`; }
    if (st === 'editing') { bg = t.editBg; bd = `1.5px solid ${t.edit}`; status = '● Editing'; statusC = t.edit; extra.animation = `nd${th === 'light' ? 'L' : 'D'} 2.6s ease-in-out infinite`; }
    if (st === 'reading') { bg = t.readBg; bd = `1px dashed ${t.read}`; status = '◌ Reading'; statusC = t.read; }
    if (st === 'changed') { bg = t.neuBg; bd = `1px solid ${t.neu}`; status = '◆ Changed'; statusC = t.neu; }
    if (st === 'faded') { bd = `1px solid ${t.neu}55`; status = '◆ Changed 25 min ago'; statusC = t.t3; }
    if (st === 'new') { bg = t.neuBg; bd = `1px solid ${t.neu}`; status = '◆ New'; statusC = t.neu; }
    if (st === 'error') { bd = `1px solid ${t.err}`; status = '▲ 1 test failing'; statusC = t.errT; }
    if (st === 'search') { bd = `1px solid ${t.t2}`; status = '⌕ Match'; statusC = t.t1; }
    if (st === 'unexplored') { bg = 'transparent'; bd = `1px dashed ${t.l3}`; nameC = t.t4; status = 'Not opened yet'; }
    if (st === 'selected' || p.selected) { extra.outline = `2px solid ${t.t1}`; extra.outlineOffset = 2; }
    if (st === 'dimmed' || p.dim) extra.opacity = .32;
    if (p.statusText) status = p.statusText;
    const row = file && !status;
    const box = { position: 'relative', width: '100%', height: '100%', boxSizing: 'border-box', borderRadius: area ? 12 : file ? 8 : 10, background: bg, border: bd, display: 'flex', flexDirection: row ? 'row' : 'column', alignItems: row ? 'center' : 'stretch', justifyContent: fn ? 'flex-start' : row ? 'space-between' : 'center', gap: fn ? 6 : row ? 8 : 2, padding: fn ? '12px 14px' : file ? '0 12px' : '0 14px', fontFamily: "'Hanken Grotesk',sans-serif", color: nameC, transition: 'opacity .2s', ...extra };
    const mono = "'JetBrains Mono',monospace";
    return {
      s: {
        box,
        name: { fontFamily: fn || file ? mono : 'inherit', fontSize: fn ? 13 : file ? 12.5 : area ? 15 : ext ? 13 : 14, fontWeight: fn || file ? 500 : area ? 700 : ext ? 500 : 600, whiteSpace: fn ? 'normal' : 'nowrap', overflowWrap: fn ? 'anywhere' : null, overflow: fn ? null : 'hidden', textOverflow: fn ? null : 'ellipsis', color: nameC, minWidth: 0 },
        meta: { fontFamily: mono, fontSize: 10.5, color: t.t4, whiteSpace: 'nowrap' },
        line: { fontSize: file ? 11.5 : 12, color: status ? statusC : t.t4, whiteSpace: 'nowrap' },
        desc: { fontSize: 13, lineHeight: 1.45, color: t.t2 },
        badge: { position: 'absolute', right: -10, top: -10, width: 22, height: 22, borderRadius: '50%', background: t.t1, color: t.inv, fontSize: 11, fontWeight: 700, display: 'grid', placeItems: 'center', fontFamily: "'Hanken Grotesk',sans-serif" },
        eb: { position: 'absolute', right: -9, top: -9, width: 18, height: 18, borderRadius: '50%', background: t.bg, border: `1px solid ${t.err}`, boxSizing: 'border-box', color: t.err, fontSize: 7, display: 'grid', placeItems: 'center' }
      },
      label: p.label ?? 'Webhooks', meta: p.meta ?? '', desc: p.desc ?? '', isFn: fn, notFn: !fn,
      status, line2: status || p.meta || '', badge: p.badge || null, err: !!p.err
    };
  }
}
</script>
</body>
</html>
