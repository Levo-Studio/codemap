<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"></helmet>
<div style="display:flex;flex-direction:column;gap:8px;font-family:'Hanken Grotesk',sans-serif;font-size:12px;color:{{ t.t3 }}">
  <span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:0;border-top:1.5px solid {{ t.t3 }};position:relative"><span style="position:absolute;right:-1px;top:-4.5px;width:0;height:0;border-left:6px solid {{ t.t3 }};border-top:3.5px solid transparent;border-bottom:3.5px solid transparent"></span></span>Calls</span>
  <span style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;box-shadow:0 0 0 1.5px {{ t.edit }};margin:0 4px"></span>Editing</span>
  <span style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;border:1px dashed {{ t.read }};box-sizing:border-box;margin:0 4px"></span>Reading</span>
  <span style="display:flex;align-items:center;gap:8px"><span style="width:18px;text-align:center;color:{{ t.neu }};font-size:9px">◆</span>Changed</span>
  <span style="display:flex;align-items:center;gap:8px"><span style="width:18px;text-align:center;color:{{ t.err }};font-size:9px">▲</span>Error</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:130},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const T={dark:{t3:'#9a9ca3',edit:'#f0a55a',read:'#7fb2f0',neu:'#6fcf97',err:'#e5484d'},light:{t3:'#62646b',edit:'#c2651a',read:'#2f6fd0',neu:'#1f8a57',err:'#d23b40'}};
class Component extends DCLogic { renderVals() { return { t: T[this.props.theme === 'light' ? 'light' : 'dark'] }; } }
</script>
</body>
</html>
